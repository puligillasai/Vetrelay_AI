name: "Full Workflow - Emergency to Discharge"
description: "End-to-end workflow: triage → soap → front_desk"
agent: "vetrelay_coordinator"
tags: ["workflow", "integration", "full_cycle", "emergency"]
timeout: 120
input:
  transcript: |
    Owner: "My dog was hit by a car! He's bleeding from his leg and won't put weight on it."
    Owner: "He's a 3-year-old Labrador, about 70 pounds, name is Buster."
  metadata:
    patient_name: "Buster"
    species: "canine"
    breed: "Labrador"
    age: 3
    weight_lbs: 70
    owner_name: "Mike Thompson"
    owner_phone: "555-0198"
  context:
    call_type: "emergency"
    workflow: "emergency_to_discharge"
expected:
  urgency: "EMERGENCY"
  escalate: true
  recommended_actions:
    - "Immediate veterinary care"
    - "Control bleeding"
    - "Immobilize limb"
    - "Emergency surgery consultation"
    - "Schedule follow-up appointment"
  handoff_to: "front_desk_agent"
  soap_note:
    subjective: "Owner reports dog hit by car, right hindlimb bleeding and non-weight bearing. 3-year-old male Labrador, 70 lbs."
    objective: "Active bleeding from right hindlimb. Open fracture of tibia/fibula suspected. Patient in shock - pale mucous membranes, tachycardia."
    assessment: "Open fracture right tibia/fibula. Hemorrhagic shock. Emergency surgical candidate."
    plan: "IV fluid resuscitation. Emergency surgery for fracture stabilization. Cephalexin 22 mg/kg IV. Buprenorphine 0.01 mg/kg IV. Bandage limb. Schedule 2-week post-op recheck."
