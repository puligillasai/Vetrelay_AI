arena:
  default_model: "claude-sonnet-5-5"
  baseline_dir: "arena/baselines"
  results_dir: "arena/results"
  scenarios_dir: "arena/scenarios"
  evaluation:
    similarity_threshold: 0.85
    metrics:
      - "accuracy"
      - "latency_ms"
      - "token_count"
      - "handoff_correctness"
      - "tool_usage_correctness"
  parallel_workers: 4
  scenario_timeout: 60