applications:
  - name: vetrelay-ai-backend
    memory: 512M
    disk_quota: 1024M
    instances: 1
    buildpacks:
      - python_buildpack
    command: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    env:
      PYTHONPATH: .
      PYTHONVERSION: 3.12.13
    health-check-type: http
    health-check-http-endpoint: /healthz
    routes:
      - route: vetrelay-ai-backend.us-south.cf.appdomain.cloud